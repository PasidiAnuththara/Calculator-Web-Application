<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div>
        <h2 class="txt">Calculator</h2>
        <input class="display" id="Calculation" type="text" placeholder="Calculation">
        <input class="display" id="results" type="text" placeholder="results">
        <input class="display" id="History" type="text" placeholder="History">

        <div class="buttons">
            <input class="function" type="button" value="7" onclick="clickFunctions()">
            <input class="function" type="button" value="8" onclick="clickFunctions()">
            <input class="function" type="button" value="9" onclick="clickFunctions()">
            <input class="function" type="button" value="÷ " onclick="clickFunctions()">
            <input class="function" type="button" value="4" onclick="clickFunctions()">
            <input class="function" type="button" value="5" onclick="clickFunctions()">
            <input class="function" type="button" value="6" onclick="clickFunctions()">
            <input class="function" type="button" value="*" onclick="clickFunctions()">
            <input class="function" type="button" value="1" onclick="clickFunctions()">
            <input class="function" type="button" value="2" onclick="clickFunctions()">
            <input class="function" type="button" value="3" onclick="clickFunctions()">
            <input class="function" type="button" value="-" onclick="clickFunctions()">
            <input class="function" type="button" value="0" onclick="clickFunctions()">
            <input class="function" type="button" value="." onclick="clickFunctions()">
            <input class="function" type="button" value="=" onclick="clickFunctions()">
            <input class="function" type="button" value="+" onclick="clickFunctions()">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
