<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="container"> 
        <center>
            <h2 class="txt">Calculator</h2>
            <input class="display" id="lblNumbers" type="text" placeholder="Calculation">
            <br>
            <input class="display" id="results" type="text" placeholder="results">
            <br>
            <input class="display" id="History" type="text" placeholder="History">
        </center>

        <div class="buttons">
            <input class="function clear" type="button" value="C" onclick="clickBtnC(this)">
            <input class="function clear" type="button" value="HI" onclick="recallHistory()()">
            <input class="function" type="button" value="<---" onclick="click()">
            <input class="function" type="button" value="÷" onclick="clickOperation(this)">

            <input class="function" type="button" value="7" onclick="clickBtn(this)">
            <input class="function" type="button" value="8" onclick="clickBtn(this)">
            <input class="function" type="button" value="9" onclick="clickBtn(this)">
            <input class="function" type="button" value="*" onclick="clickOperation(this)">

            <input class="function" type="button" value="4" onclick="clickBtn(this)">
            <input class="function" type="button" value="5" onclick="clickBtn(this)">
            <input class="function" type="button" value="6" onclick="clickBtn(this)">
            <input class="function" type="button" value="-" onclick="clickOperation(this)">

            <input class="function" type="button" value="1" onclick="clickBtn(this)">
            <input class="function" type="button" value="2" onclick="clickBtn(this)">
            <input class="function" type="button" value="3" onclick="clickBtn(this)">
            <input class="function" type="button" value="+" onclick="clickOperation(this)">

            <input class="function zero" type="button" value="0" onclick="clickBtn(this)">
            <input class="function" type="button" value="." onclick="clickBtnDot(this)">
            <input class="function equal" type="button" value="=" onclick="clickCalculationProcess()">
        </div>
    </div>

    <script src="app.js"></script>
</body>


</html>
